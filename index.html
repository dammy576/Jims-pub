<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Title, description, theme color and icon are filled in from business.json by script.js. -->
  <title>Welcome</title>
  <meta name="description" content="">
  <meta name="theme-color" content="">
  <link rel="icon" href="data:,">
  <link rel="preload" href="business.json" as="fetch" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<!--
  All business-specific content (name, menu, hours, contact, colors…) lives in business.json.
  This file is only the layout; script.js fills it in. See NEW-CLIENT.md.
-->
<body class="is-loading">
  <noscript><p class="load-error">Please turn on JavaScript to view this page.</p></noscript>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header" id="top">
    <nav class="nav" aria-label="Main">
      <a class="nav-brand" href="#top" data-text="name"></a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-links">
        <span class="sr-only">Toggle menu</span>
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
      </button>
      <ul class="nav-links" id="nav-links">
        <li><a href="#about">About</a></li>
        <li><a href="#menu">Menu</a></li>
        <li><a href="#hours">Hours</a></li>
        <li><a href="#reserve">Reserve</a></li>
        <li><a href="#visit">Visit</a></li>
      </ul>
    </nav>
  </header>

  <main id="main">
    <!-- HERO -->
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-glow" aria-hidden="true"></div>
      <div class="hero-inner">
        <p class="eyebrow" data-text="heroEyebrow"></p>
        <h1 id="hero-title" class="hero-title" data-text="name"></h1>
        <p class="hero-tagline" data-text="tagline"></p>
        <p class="hero-sub" data-text="heroIntro"></p>
        <div class="hero-actions">
          <a class="btn btn-primary" href="#reserve" data-text="reservations.bookButtonLabel"></a>
          <a class="btn btn-ghost" href="#menu">See the menu</a>
        </div>
      </div>
    </section>

    <!-- ABOUT -->
    <section class="section about" id="about" aria-labelledby="about-title">
      <div class="container about-grid">
        <div id="about-text">
          <p class="eyebrow" id="about-eyebrow"></p>
          <h2 id="about-title" class="section-title" data-text="about.heading"></h2>
          <!-- about.paragraphs are added here -->
        </div>
        <ul class="about-points" id="about-points"></ul>
      </div>
    </section>

    <!-- MENU -->
    <section class="section menu" id="menu" aria-labelledby="menu-title">
      <div class="container">
        <p class="eyebrow center">The Menu</p>
        <h2 id="menu-title" class="section-title center" data-text="menu.heading"></h2>

        <!-- Featured section (e.g. pizzas) -->
        <div class="pizza-block" id="menu-featured">
          <h3 class="menu-heading"><span data-text="menu.featured.title"></span></h3>
          <p class="menu-note center" data-text="menu.featured.note"></p>
          <div class="pizza-grid" id="menu-featured-items"></div>
        </div>

        <div class="menu-columns">
          <div class="menu-col" id="menu-food"></div>
          <div class="menu-col" id="menu-drinks"></div>
        </div>
      </div>
    </section>

    <!-- HOURS -->
    <section class="section hours" id="hours" aria-labelledby="hours-title">
      <div class="container hours-grid">
        <div>
          <p class="eyebrow">Hours</p>
          <h2 id="hours-title" class="section-title" data-text="hours.heading"></h2>
          <table class="hours-table">
            <tbody id="hours-rows"></tbody>
          </table>
          <p class="small-note" data-text="hours.note"></p>
        </div>
        <div class="happy-hour" id="happy-hour">
          <p class="eyebrow">Happy Hour</p>
          <h3 data-text="happyHour.when"></h3>
          <ul id="happy-hour-deals"></ul>
          <p class="small-note" data-text="happyHour.note"></p>
        </div>
      </div>
    </section>

    <!-- RESERVATIONS -->
    <section class="section reserve" id="reserve" aria-labelledby="reserve-title">
      <div class="container narrow">
        <p class="eyebrow center">Reservations</p>
        <h2 id="reserve-title" class="section-title center" data-text="reservations.heading"></h2>
        <p class="center" id="reserve-intro"></p>

        <form class="reserve-form" id="reserve-form" method="POST" novalidate>
          <div class="field">
            <label for="res-name">Name</label>
            <input id="res-name" name="name" type="text" autocomplete="name" required>
          </div>
          <div class="field">
            <label for="res-contact">Phone or email</label>
            <input id="res-contact" name="phone_or_email" type="text" autocomplete="email" required>
          </div>
          <div class="field-row">
            <div class="field">
              <label for="res-party">Party size</label>
              <select id="res-party" name="party_size" required aria-describedby="res-party-hint">
                <option value="" selected>Choose</option>
                <!-- 1…reservations.maxPartySize are added here -->
              </select>
              <p class="field-hint" id="res-party-hint"></p>
            </div>
            <div class="field">
              <label for="res-date">Date</label>
              <input id="res-date" name="date" type="date" required>
            </div>
            <div class="field">
              <label for="res-time">Time</label>
              <input id="res-time" name="time" type="time" required>
            </div>
          </div>
          <!-- Honeypot for spam bots: hidden from people, Formspree drops submissions that fill it. -->
          <div class="hp-field" aria-hidden="true">
            <label for="res-gotcha">Leave this field empty</label>
            <input id="res-gotcha" name="_gotcha" type="text" tabindex="-1" autocomplete="off">
          </div>
          <p class="form-status" id="reserve-status" role="status" aria-live="polite" hidden></p>
          <button class="btn btn-primary btn-block" id="reserve-submit" type="submit" data-text="reservations.submitButtonLabel"></button>
        </form>
      </div>
    </section>

    <!-- LOCATION / CONTACT -->
    <section class="section visit" id="visit" aria-labelledby="visit-title">
      <div class="container visit-grid">
        <div>
          <p class="eyebrow">Find Us</p>
          <h2 id="visit-title" class="section-title" data-text="contact.heading"></h2>
          <address id="visit-address"></address>
          <p id="visit-contact"></p>
          <p id="visit-social" hidden></p>
          <p class="small-note" data-text="contact.directions"></p>
        </div>
        <div class="map-card" aria-hidden="true">
          <div class="map-street map-street-h"></div>
          <div class="map-street map-street-v"></div>
          <div class="map-pin"><span data-text="name"></span></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; <span id="year"></span> <span id="footer-place"></span></p>
      <p class="demo-note" data-text="demoNote" hidden></p>
    </div>
  </footer>

  <!-- CHAT WIDGET -->
  <div class="chat" id="chat">
    <button class="chat-bubble" id="chat-toggle" type="button" aria-expanded="false" aria-controls="chat-window">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" focusable="false">
        <path fill="currentColor" d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 4v-4H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/>
      </svg>
      <span class="sr-only" id="chat-toggle-label"></span>
    </button>

    <section class="chat-window" id="chat-window" role="dialog" hidden>
      <header class="chat-header">
        <div>
          <strong id="chat-title"></strong>
          <span id="chat-subtitle"></span>
        </div>
        <button class="chat-close" id="chat-close" type="button" aria-label="Close chat">&times;</button>
      </header>
      <ol class="chat-messages" id="chat-messages" aria-live="polite"></ol>
      <form class="chat-form" id="chat-form">
        <label for="chat-input" class="sr-only">Your message</label>
        <textarea id="chat-input" rows="1" maxlength="500" placeholder="Ask about the menu, hours…" required></textarea>
        <button class="chat-send" id="chat-send" type="submit">Send</button>
      </form>
      <p class="chat-counter" id="chat-counter" aria-live="polite">0 / 500</p>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
